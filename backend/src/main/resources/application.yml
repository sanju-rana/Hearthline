spring:
  application:
    name: hearthline
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Hearthline
    description: Restaurant chain direct ordering and kitchen display

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-hearthline-jwt-secret-change-me-32}
    expiration-minutes: 120
    cookie-name: hearthline_token
    cookie-secure: false
  payment:
    mode: demo
    allow-simulated-failure: true
  order:
    tax-rate: 0.05
    delivery-fee: 40.00
    currency: INR
    prep-base-minutes: 15
    prep-per-item-minutes: 2
    prep-max-minutes: 45
    business-zone: Asia/Kolkata
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}

logging:
  level:
    com.restaurant: INFO
