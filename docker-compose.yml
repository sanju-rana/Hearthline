services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hearthline
      POSTGRES_USER: hearthline
      POSTGRES_PASSWORD: hearthline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearthline -d hearthline"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hearthline
      SPRING_DATASOURCE_USERNAME: hearthline
      SPRING_DATASOURCE_PASSWORD: hearthline
      JWT_SECRET: dev-only-hearthline-jwt-secret-change-me-32
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
